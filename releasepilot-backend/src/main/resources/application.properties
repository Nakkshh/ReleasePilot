spring.application.name=releasepilot-backend
server.port=8080

# LLM: Groq via OpenAI-compatible API (/v1 is required in base-url)
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

# GitHub (used from Stage B)
github.api.base-url=https://api.github.com
github.repo.owner=Nakkshh
github.repo.name=ReleasePilot
github.token=${GITHUB_TOKEN:}

logging.level.com.releasepilot=DEBUG

agent.max-iterations=8
agent.time-budget-seconds=90

agent.max-attempts=2
agent.force-fallback=false