spring.application.name=releasepilot-backend
server.port=8080

# LLM: Groq via OpenAI-compatible API (/v1 is required in base-url)
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# GitHub (used from Stage B)
github.api.base-url=https://api.github.com
github.repo.owner=Nakkshh
github.repo.name=ReleasePilot
github.token=${GITHUB_TOKEN:}

logging.level.com.releasepilot=DEBUG

agent.max-iterations=8
agent.time-budget-seconds=90

agent.max-attempts=2
agent.force-fallback=false

# Phase 8: PostgreSQL + Flyway
spring.datasource.url=jdbc:postgresql://localhost:5433/releasepilot
spring.datasource.username=${DB_USER:releasepilot_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
release.draft-ttl-hours=24

release.admin-token=${RELEASEPILOT_ADMIN_TOKEN:}

# Phase 9: embeddings (local ONNX, all-MiniLM-L6-v2 = 384 dims) + pgvector (schema owned by Flyway V2)
spring.ai.model.embedding=transformers
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-validation=true

# Local embedding model files (not downloaded at startup). Override the folder with EMBEDDING_MODEL_DIR.
spring.ai.embedding.transformer.onnx.model-uri=file:${EMBEDDING_MODEL_DIR:./models}/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=file:${EMBEDDING_MODEL_DIR:./models}/all-MiniLM-L6-v2/tokenizer.json

# Phase 9: knowledge base
knowledge.ingest-on-startup=true
knowledge.chunk-max-chars=900

# Provisional until the retrieval eval shows the real score gap (see Phase 9.4)
knowledge.top-k=4
knowledge.min-score=0.30
