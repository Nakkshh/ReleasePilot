spring.application.name=releasepilot-backend
server.port=8080

# Spring AI: explicitly activate Gemini
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.temperature=0.5

# Helpful during development
logging.level.com.releasepilot=DEBUG